<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BookmarkWizard</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13z" />
        <path d="m15.5 15.5 4.5 4.5" />
      </svg>
      <input id="search" type="text" placeholder="Search bookmarks" autocomplete="off" spellcheck="false" />
    </div>
    <button id="star-btn" class="icon-btn" type="button" title="Bookmark this page" aria-label="Bookmark this page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.6l2.6 5.2 5.8.9-4.2 4.1 1 5.7-5.2-2.7-5.2 2.7 1-5.7-4.2-4.1 5.8-.9z" />
      </svg>
    </button>
    <button id="new-folder-btn" class="icon-btn" type="button" title="New folder" aria-label="New folder">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l1.9 2h7.5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" />
        <path d="M12 10.5v5" />
        <path d="M9.5 13h5" />
      </svg>
    </button>
    <button id="settings-btn" class="icon-btn" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7.5h8" />
        <path d="M17 7.5h3" />
        <path d="M4 16.5h3" />
        <path d="M12 16.5h8" />
        <circle cx="14.5" cy="7.5" r="2.1" />
        <circle cx="9.5" cy="16.5" r="2.1" />
      </svg>
    </button>
  </header>
  <main id="main">
    <div id="list" role="tree" aria-label="Bookmarks"></div>
  </main>
  <footer>
    <span id="count"></span>
    <span class="hint">↑↓ navigate · Enter open · drag to move</span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
