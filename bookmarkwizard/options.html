<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BookmarkWizard settings</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="card">
    <h1>BookmarkWizard</h1>
    <p class="sub">Small settings for a small tool.</p>
    <section>
      <label class="field">
        <span>Theme</span>
        <select id="theme">
          <option value="system">Match system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="field">
        <span>Save new bookmarks to</span>
        <select id="default-folder"></select>
      </label>
      <label class="check">
        <input type="checkbox" id="open-new-tab" />
        <span>Open bookmarks in a new tab</span>
      </label>
      <label class="check">
        <input type="checkbox" id="show-favicons" />
        <span>Show favicons</span>
      </label>
    </section>
    <footer>
      <span class="tip">Tip: press <kbd>Alt</kbd>+<kbd>B</kbd> to open the popup.</span>
      <span id="status" class="status" hidden>Saved ✓</span>
    </footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
